[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team-content-engine"
version = "0.1.0"
description = "Agentic content engine that learns from a swipe corpus and produces daily social media packages"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "pillow>=10",
    "alembic>=1.13",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-docx>=1.1",
    "structlog>=24.1",
    "tenacity>=8.2",
    "python-multipart>=0.0.9",
    "jsonschema>=4.20",
    "aiohttp>=3.9",
    "tzdata>=2024.1",  # editorial week = Asia/Jerusalem; slim images may lack zoneinfo
    "pywebpush>=2.0",  # web push for "your script is ready"; unused until VAPID keys exist
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "factory-boy>=3.3",
    "ruff==0.17.6",  # pinned: an unpinned ruff changes what CI fails on
    "mypy>=1.9",
    "aiosqlite>=0.19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tce"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# 21-Nov (T-23884): CI had been red on every push since March, 2,316 of its 2,597 lint
# hits long lines, so nobody read it and a missing import reached the live box. Style the
# code never followed is off; everything that names a real fault (undefined names, unused
# imports and variables, redefinitions in src) stays on and CI fails on it.
ignore = [
    "E501",   # line length
    "E741",   # a variable called l
    "E702",   # two statements on one line
    "I001",   # import order
    "N806", "N812", "N814", "N818",  # naming style
    "UP015", "UP017", "UP037", "UP041",  # newer spellings of the same thing
]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture imported from another test module and then taken as an argument.
"tests/**" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
