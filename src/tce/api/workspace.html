<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Editorial workspace</title>
<script>
/* Set the base before the first asset reference, and everything else in this
 * head can stay a plain relative href.
 *
 * Without it the nested routes were dead. This one page is served at /today and
 * at /topics/<id>, and the whole app is ALSO mounted under /tce on
 * bot.kivimedia.co. A relative "workspace.js" on /topics/<id> resolves to
 * /topics/workspace.js, which does not exist - so the topic room and the script
 * workshop loaded with no stylesheet and no script at all, and sat on the
 * "Opening your workspace" placeholder forever. The flat routes worked, which is
 * exactly why it survived every check that only opened those.
 *
 * An inline script in <head> runs during parsing, so the <base> it appends
 * applies to every tag after it. */
(function () {
  var base = document.createElement("base");
  base.href = window.location.pathname.indexOf("/tce/") === 0 ? "/tce/" : "/";
  document.head.appendChild(base);
})();
</script>
<link rel="stylesheet" href="workspace.css">
<link rel="manifest" href="workspace.webmanifest">
<meta name="theme-color" content="#10213b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TCE">
</head>
<body>

<header class="topbar">
  <a class="kmbot-link" href="https://bot.kivimedia.co/" aria-label="Back to KM BOT">&#8592; KM BOT</a>
  <div class="identity">
    <strong id="pageTitle">Today</strong>
    <span id="pageStatus">Loading</span>
  </div>
  <div class="topbar-actions">
    <!-- Smaller and bigger, not a cycling "Aa": "the icon of Aa means nothing"
         (23-Sep). Same pair as the recording studio. -->
    <button class="icon-button text-size" id="readerSmaller" type="button"
            aria-label="Smaller text" title="Smaller text">A&#8722;</button>
    <button class="icon-button text-size" id="readerBigger" type="button"
            aria-label="Bigger text" title="Bigger text">A+</button>
  </div>
</header>

<main id="view" aria-live="polite">
  <div class="page">
    <p class="working">Opening your workspace</p>
  </div>
</main>

<!-- The bottom action bar. Carries the thing he most wants to do on this page:
     Start recording when a script is ready, and the contextual conversation,
     whose label names the object so it is never a general chat window. It is a
     bar rather than a floating pill so it never sits on top of another button,
     and the page reserves its height. -->
<div class="action-bar" id="actionBar" hidden></div>

<nav class="bottom-nav" id="bottomNav" aria-label="Sections">
  <a href="/today"   data-route="today"   aria-current="page"><span class="glyph" aria-hidden="true">&#9673;</span>Today</a>
  <a href="/topics"  data-route="topics"><span class="glyph" aria-hidden="true">&#9776;</span>Topics</a>
  <a href="/week"    data-route="week"><span class="glyph" aria-hidden="true">&#9635;</span>This week</a>
  <a href="/record"  data-route="record"><span class="glyph" aria-hidden="true">&#9679;</span>Record</a>
  <a href="/library" data-route="library"><span class="glyph" aria-hidden="true">&#9638;</span>Library</a>
</nav>

<!-- The conversation sheet. Full height, one obvious close, and it never
     dismisses on an outside tap: there is a half-typed instruction in it. -->
<section class="sheet" id="talkSheet" role="dialog" aria-modal="true"
         aria-labelledby="talkTitle" hidden>
  <div class="sheet-head">
    <div>
      <strong id="talkTitle">Talk about this</strong>
      <span id="talkContext"></span>
    </div>
    <button class="icon-button" id="talkClose" type="button" aria-label="Close the conversation">&#10005;</button>
  </div>
  <div class="sheet-body" id="talkBody"></div>
  <div class="sheet-foot">
    <div class="mode-row" role="group" aria-label="What this conversation may do">
      <button class="chip" type="button" data-mode="discuss" aria-pressed="true">Discuss</button>
      <button class="chip" type="button" data-mode="propose" aria-pressed="false">Propose changes</button>
    </div>
    <textarea id="talkInput" rows="3"
              placeholder="Say what you think. Nothing changes unless you accept it."></textarea>
    <div class="talk-controls">
      <button class="btn quiet" id="speakBtn" type="button" aria-pressed="false"
              title="Read replies out loud">Read aloud</button>
      <button class="btn primary" id="talkSend" type="button">Send</button>
    </div>
  </div>
</section>

<script src="workspace.js"></script>
</body>
</html>
